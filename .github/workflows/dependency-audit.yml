name: Dependency Vulnerability Audit

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "bun.lock"
      - ".github/workflows/dependency-audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "bun.lock"
  schedule:
    # Daily at 04:00 UTC — catches newly-disclosed CVEs even without code changes
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  npm-audit:
    name: npm audit (high & critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run npm audit
        run: npm audit --audit-level=high

  osv-scan:
    name: OSV Scanner (Google OSV DB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.0.2
        with:
          scan-args: |-
            --lockfile=./package-lock.json
            --format=sarif
            --output=osv-results.sarif
        continue-on-error: true

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: osv-results.sarif
          category: osv-scanner

  create-alert-issue:
    name: Open issue on failure
    needs: [npm-audit, osv-scan]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Create tracking issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🚨 Dependency vulnerability detected (${new Date().toISOString().slice(0,10)})`;
            const body = [
              `The scheduled dependency audit detected new high/critical vulnerabilities.`,
              ``,
              `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ``,
              `Review the run logs and the [Security tab](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/security) for details, then bump the affected packages.`,
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["security", "dependencies"],
            });