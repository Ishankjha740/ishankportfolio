name: Secret Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  gitleaks:
    name: Gitleaks (full history scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so we catch secrets committed in older commits, not just the diff
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fail the build on any leak
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"

  trufflehog:
    name: TruffleHog (verified secrets only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          # On PRs, diff base..head. On push/schedule/manual, scan the whole filesystem
          # (omitting base/head avoids the "BASE and HEAD are the same" error).
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
          # --only-verified: skip noisy unverified matches, alert only on live credentials
          extra_args: --only-verified --fail

  alert-on-schedule:
    name: Open issue on scheduled failure
    needs: [gitleaks, trufflehog]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = `🚨 Secret detected in repository (${new Date().toISOString().slice(0,10)})`;
            const body = [
              `The scheduled secret scan flagged a potential credential in the codebase.`,
              ``,
              `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ``,
              `**If verified:** rotate the credential immediately, then purge it from git history.`,
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["security", "secret-leak"],
            });